<!doctype html>
<html lang="fr" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>RemoteOps — Agent</title>
    <link rel="stylesheet" href="tokens.css" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Fira+Sans:wght@400;500;600;700&display=swap");
      body {
        margin: 0;
        font-family: "Fira Sans", system-ui, sans-serif;
        background: var(--color-background);
        color: var(--color-foreground);
        padding: 24px;
      }
      h1 {
        font-size: 1.1rem;
        margin: 0 0 16px;
      }
      .field {
        margin-bottom: 14px;
      }
      label {
        display: block;
        font-size: 0.8125rem;
        color: var(--color-muted-foreground);
        margin-bottom: 4px;
        font-weight: 600;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        min-height: 40px;
        padding: 0 10px;
        border-radius: 6px;
        border: 1px solid var(--color-border);
        background: var(--color-card);
        color: var(--color-foreground);
        font-size: 0.9375rem;
      }
      button {
        width: 100%;
        min-height: 40px;
        border-radius: 6px;
        border: none;
        background: var(--color-accent);
        color: var(--color-on-accent);
        font-weight: 600;
        cursor: pointer;
        font-size: 0.9375rem;
      }
      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .error {
        color: #f87171;
        font-size: 0.8125rem;
        margin-top: 8px;
        min-height: 1em;
      }
      .status-card {
        border: 1px solid var(--color-border);
        border-radius: 10px;
        padding: 16px;
        background: var(--color-card);
      }
      .status-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 10px;
        font-size: 0.875rem;
      }
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--color-muted-foreground);
        flex-shrink: 0;
      }
      .dot.online {
        background: #4ade80;
      }
      .dot.session {
        background: #38bdf8;
      }
      .log {
        font-family: "Fira Code", monospace;
        font-size: 0.75rem;
        color: var(--color-muted-foreground);
        max-height: 140px;
        overflow-y: auto;
        white-space: pre-wrap;
        border-top: 1px solid var(--color-border);
        margin-top: 12px;
        padding-top: 8px;
      }
    </style>
  </head>
  <body>
    <h1>RemoteOps — Agent</h1>

    <section id="enroll-section" hidden>
      <p style="color: var(--color-muted-foreground); font-size: 0.875rem">
        Entrez le code affiché dans le tableau de bord de l'administrateur.
      </p>
      <div class="field">
        <label for="server-url">Adresse du serveur</label>
        <input id="server-url" placeholder="https://remoteops.exemple.interne" />
      </div>
      <div class="field">
        <label for="enroll-code">Code d'enrôlement</label>
        <input id="enroll-code" placeholder="ABCD1234" style="text-transform: uppercase; letter-spacing: 0.15em" maxlength="8" />
      </div>
      <div class="field">
        <label for="device-name">Nom de ce poste (optionnel)</label>
        <input id="device-name" placeholder="ex. PC-Compta-03" />
      </div>
      <button id="enroll-btn" type="button">Enrôler ce poste</button>
      <p class="error" id="enroll-error"></p>
    </section>

    <section id="status-section" hidden>
      <div class="status-card">
        <div class="status-row"><span class="dot" id="status-dot"></span><span id="status-text">Connexion…</span></div>
        <div class="status-row" style="color: var(--color-muted-foreground)">
          Poste : <strong id="device-label" style="color: var(--color-foreground); margin-left: 4px"></strong>
        </div>
        <div class="log" id="log" aria-live="polite"></div>
      </div>
    </section>

    <script src="worker.js" type="module"></script>
  </body>
</html>
